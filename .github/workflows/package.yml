name: Build Reez C-output extension
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-18
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - run: sudo apt-get update && sudo apt-get install -y llvm-18-dev libclang-18-dev clang-18 libclang-cpp18-dev libssl-dev pkg-config
      - run: uv sync --locked
      - run: uv run --locked rustup toolchain install 1.99.1 --profile minimal --component rust-docs
      - run: uv run --locked python tools/setup_c2rust.py
      - run: uv run --locked python tools/build_release.py
      - run: uv run --locked node --test tests/studio.test.cjs
      - run: uv run --locked pytest -q tests/test_packaged_c_backend.py
      - run: uv run --locked python tools/package.py
      - run: uv run --locked pytest -q tests/test_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: reez-rust-output
          path: |
            artifacts/releases/*.zip
            artifacts/releases/*.sha256
          if-no-files-found: error
# Real Windows EEZ Studio + WSL bridge checks are run with tools/check_package.py
# and tools/check_studio.py on a Windows host that has EEZ Studio and WSL.
